[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "words-generator"
version = "0.1.0"
description = "Cross-platform LLM-powered unique word generator"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "NUTIS-YT" }]
dependencies = [
    "PySide6>=6.8",
    "httpx>=0.27",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9"]

[project.scripts]
words-generator = "words_generator.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/words_generator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
